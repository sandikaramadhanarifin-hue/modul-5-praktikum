<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Menggunakan Div</title>
  </head>

  <body>
    <div style="position: relative;">
      <div style="opacity: 0.5; position: absolute; top: -30px; left: 50px; width: 130%; height: 150%; background-color: #40b3df;"></div>
    </div>

    <div style="margin-top: 30px; width: 100%; height: 130px; padding: 20px; border-radius: 10px; border: 10px solid #40b3df; font-size: 20px;">
      <h1 style="text-align: center; color: black;">Selamat Datang di Webku</h1>

      <div style="letter-spacing: 12px; font-size: 15px; position: relative;">
        <p style="text-align: center;">Ini adalah contoh penggunaan div dalam HTML.</p>
      </div>

      <span style="background-color: antiquewhite; color: azure;">Kotak</span>
    </div>
  </body>
</html>
